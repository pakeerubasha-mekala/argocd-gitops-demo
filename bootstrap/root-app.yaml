# The only thing applied by hand: `kubectl apply -f bootstrap/root-app.yaml`.
# It points Argo CD at the apps/ folder, and every Application in there is created and kept in sync from Git.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/pakeerubasha-mekala/argocd-gitops-demo.git
    targetRevision: main
    path: apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
